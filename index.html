<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公文來文分析平台</title>
<style>
:root{
  --dark:#1a365d;--mid:#2b6cb0;--light:#ebf4ff;
  --green:#276749;--gold:#b7791f;--bg:#f0f4f8;--card:#fff;--border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;background:var(--bg);color:#2d3748;min-height:100vh}

header{background:linear-gradient(135deg,var(--dark) 0%,var(--mid) 100%);color:#fff;padding:0}
.header-inner{max-width:1100px;margin:0 auto;padding:28px 32px;display:flex;align-items:center;gap:18px}
.header-icon{width:56px;height:56px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.header-text h1{font-size:22px;font-weight:700;letter-spacing:.5px}
.header-text p{font-size:13px;opacity:.75;margin-top:4px}

.main{max-width:1100px;margin:0 auto;padding:36px 32px 60px}

.section-title{font-size:13px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:1px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}

.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:transform .18s,box-shadow .18s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}

.card-banner{height:8px;background:linear-gradient(90deg,var(--mid),#63b3ed)}
.card-banner.green{background:linear-gradient(90deg,#276749,#48bb78)}
.card-banner.gold{background:linear-gradient(90deg,#b7791f,#f6ad55)}

.card-body{padding:20px 22px 22px;flex:1;display:flex;flex-direction:column}
.card-icon{font-size:32px;margin-bottom:12px}
.card-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:6px}
.card-desc{font-size:12px;color:#718096;line-height:1.7;flex:1}

.card-meta{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge.blue{background:var(--light);color:var(--mid)}
.badge.green{background:#f0fff4;color:#276749}
.badge.grey{background:#f7fafc;color:#718096}

.card-arrow{margin-left:auto;color:var(--mid);font-size:18px;opacity:.6}

footer{text-align:center;padding:24px;color:#a0aec0;font-size:11px;border-top:1px solid var(--border)}
footer a{color:var(--mid);text-decoration:none}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-icon">🗂️</div>
    <div class="header-text">
      <h1>公文來文分析平台</h1>
      <p>依來文單位分類整理的公文收文儀表板集合</p>
    </div>
  </div>
</header>

<div class="main">

  <div class="section-title">儀表板單元</div>

  <div class="cards">

    <a class="card" href="教育部/index.html">
      <div class="card-banner"></div>
      <div class="card-body">
        <div class="card-icon">📋</div>
        <div class="card-title">教育部來文分析</div>
        <div class="card-desc">
          教育部（含所屬機關）來文公文統計，涵蓋高等教育司、師資培育司、學生事務司等 12 個司處別，資料期間 2025年7月至 2026年5月。
        </div>
        <div class="card-meta">
          <span class="badge blue">1,743 件</span>
          <span class="badge green">11 個月</span>
          <span class="badge grey">12 司處</span>
          <span class="card-arrow">→</span>
        </div>
      </div>
    </a>

    <div class="card" style="opacity:.45;pointer-events:none;border:2px dashed var(--border);box-shadow:none">
      <div class="card-banner" style="background:#e2e8f0"></div>
      <div class="card-body">
        <div class="card-icon">➕</div>
        <div class="card-title" style="color:#a0aec0">新增單元</div>
        <div class="card-desc">未來可加入其他來文機關的儀表板，例如：國科會、各縣市政府等。</div>
        <div class="card-meta">
          <span class="badge grey">即將上線</span>
        </div>
      </div>
    </div>

  </div>
</div>

<footer>
  公文來文分析平台 ｜ 資料來源：公文收文清單 CSV ｜
  <a href="https://github.com/lyang0939/moe-document-dashboard" target="_blank">GitHub</a>
</footer>

</body>
</html>
